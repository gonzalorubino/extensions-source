name: Personal repo

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'lib/**'
      - 'lib-multisrc/**'
      - '.github/personal/**'
      - '.github/workflows/personal_repo.yml'
  schedule:
    # Lunes 06:00 UTC: trae los cambios de keiyoushi y recompila
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sync with keiyoushi
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN can't push commits that touch .github/workflows, and upstream changes them often
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/keiyoushi/extensions-source.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin main

  build-publish:
    name: Build and publish
    needs: sync-upstream
    if: ${{ !cancelled() && needs.sync-upstream.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build extensions
        working-directory: main
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > signingkey.jks
          TASKS=()
          while read -r ext; do
            [[ -z "$ext" || "$ext" == \#* ]] && continue
            TASKS+=(":src:${ext//\//:}:assembleRelease")
          done < .github/personal/extensions.txt
          ./gradlew "${TASKS[@]}"
          rm signingkey.jks
          mkdir -p ~/apk-artifacts
          for info in src/*/*/build/keiyoushi-source-info.json; do
            dir=$(dirname "$info")
            mkdir -p ~/apk-artifacts/"$dir"
            cp -r "$dir"/keiyoushi-source-info.json "$dir"/outputs ~/apk-artifacts/"$dir"/
          done

      - name: Checkout repo branch
        run: |
          if git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/repo; then
            git clone --depth 1 --branch repo "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          else
            mkdir repo && cd repo && git init -b repo
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_KEY_FINGERPRINT }}
        run: |
          pip install protobuf
          python -u ../main/.github/personal/publish.py "[]" "$GITHUB_SHA" true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update extensions repo"
            git push origin repo
          fi
